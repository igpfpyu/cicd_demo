
name: Frontend CI & Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # 3. 启用 Yarn
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      # 4. 检查环境
      - name: Check Environment
        run: |
          node -v
          yarn -v

      # 5. 安装依赖
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # 6. 代码检查
      - name: Lint
        run: yarn lint

      # 7. 项目构建
      - name: Build
        run: yarn build

      # 8. 安装 SSH 和 rsync
      - name: Install Deploy Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      # 9. 配置 SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 10. 测试 SSH 连接
      - name: Test SSH Connection
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo SSH connection successful"

      # 11. 创建服务器部署目录
      - name: Prepare Deploy Directory
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      # 12. 上传前端构建产物
      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"
      # 13. 检查 Nginx 容器
      - name: Verify Nginx Container
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'docker ps --filter "name=nginx"'

      # 13. 发布完成
      - name: Deployment Success
        run: |
          echo "Frontend deployment successful!"
          echo "Version: ${GITHUB_REF_NAME}"
