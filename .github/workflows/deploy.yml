
name: Frontend CI & Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Node.js 和 Yarn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      # 3. 安装依赖
      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # 4. 代码检查
      - name: Lint
        run: yarn lint

      # 5. 构建项目
      - name: Build
        run: yarn build

      # 6. 配置 SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 7. 上传构建产物
      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      # 8. 重启并验证 Nginx
      - name: Restart Nginx
        env:
          SERVER_HOST: ${{ secrets.VPS_HOST }}
          SERVER_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'docker restart my-nginx &&
             docker ps --filter "name=^/my-nginx$" --filter "status=running" --format "{{.Names}}" | grep -qx my-nginx'

      # 9. 部署完成
      - name: Deployment Success
        run: |
          echo "Frontend deployment successful!"
          echo "Version: ${GITHUB_REF_NAME}"
